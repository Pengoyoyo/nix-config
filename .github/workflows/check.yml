name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: nix fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Formatierung prüfen
        run: nix fmt -- --check .

  # Hinweis: "nix flake check" läuft hier bewusst NICHT.
  # hardware-configuration.nix ist maschinenspezifisch und wirft in
  # der Platzhalter-Variante bewusst einen Fehler – der Job würde
  # also immer rot sein. Sobald du deine echte Hardware-Config
  # eingecheckt hast, kannst du folgenden Job aktivieren:
  #
  # build:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: cachix/install-nix-action@v27
  #     - run: nix build .#nixosConfigurations.nixos-desktop.config.system.build.toplevel
